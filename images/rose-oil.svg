<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="#FFF8F0"/>

  <!-- Glass Bottle -->
  <ellipse cx="150" cy="180" rx="60" ry="90" fill="url(#glassGrad)" stroke="#8B4513" stroke-width="2"/>
  <rect x="90" y="180" width="120" height="90" fill="url(#glassGrad)" stroke="#8B4513" stroke-width="2"/>

  <!-- Bottle Neck -->
  <rect x="135" y="80" width="30" height="100" fill="url(#glassGrad)" stroke="#8B4513" stroke-width="2"/>

  <!-- Bottle Cap -->
  <rect x="125" y="60" width="50" height="20" fill="#D4AF37" stroke="#8B4513" stroke-width="2"/>

  <!-- Liquid -->
  <ellipse cx="150" cy="225" rx="50" ry="70" fill="url(#roseGrad)" opacity="0.8"/>

  <!-- Rose Petals -->
  <ellipse cx="150" cy="120" rx="25" ry="30" fill="#FF69B4" opacity="0.7"/>
  <ellipse cx="140" cy="115" rx="20" ry="25" fill="#FF1493" opacity="0.6"/>
  <ellipse cx="160" cy="115" rx="20" ry="25" fill="#FF1493" opacity="0.6"/>
  <ellipse cx="150" cy="110" rx="20" ry="25" fill="#FFB6C1" opacity="0.8"/>

  <!-- Leaves -->
  <path d="M 120 160 Q 100 170 90 180" stroke="#228B22" stroke-width="3" fill="none"/>
  <path d="M 180 160 Q 200 170 210 180" stroke="#228B22" stroke-width="3" fill="none"/>

  <!-- Label -->
  <rect x="110" y="200" width="80" height="40" fill="#F5E6D3" stroke="#8B4513" stroke-width="1" rx="5"/>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#8B4513" font-family="serif">Rose Oil</text>
  <text x="150" y="235" text-anchor="middle" font-size="10" fill="#5D4E37">10ml</text>
</svg>